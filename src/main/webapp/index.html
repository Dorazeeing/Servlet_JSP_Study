<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon"
              href="https://img.shields.io/badge/-black?style=for-the-badge&logo=apachetomcat&logoColor=white">
        <title>Servlet Practice</title>
        <link rel="stylesheet" href="assets/css/style.css">
    </head>
    <body>
        <h1>첫 Servlet 호출</h1>
        <hr>
        <br>

        <h2>Step 1.</h2>
        <fieldset>
            <legend>신청자 정보(get)</legend>
            <form action="hello" method="get">
                <label for="getName">이름:&nbsp;&nbsp;<input id="getName" name="name"></label>
                <button>GET 요청</button>
            </form>
        </fieldset>
        <br>

        <fieldset>
            <legend>신청자 정보(post)</legend>
            <form action="hello" method="post">
                <label for="postName">이름:&nbsp;&nbsp;<input id="postName" name="name"></label>
                <button>POST 요청</button>
            </form>
        </fieldset>

        <br>
        <br>
        <h2>Step 2.</h2>
        <fieldset id="spec">
            <legend>신청자 상세 정보(get)</legend>
            <form action="greet" method="get">
                <label for="getSpecName">이름:&nbsp;&nbsp;<input id="getSpecName" name="name"></label>
                <br>
                <label for="getSpecEmail">메일:&nbsp;&nbsp;<input id="getSpecEmail" name="email"></label>
                <button>GET 요청</button>
            </form>
        </fieldset>
        <br>

        <br>

    </body>
</html>
